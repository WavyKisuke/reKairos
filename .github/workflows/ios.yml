name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Detect project
        id: project
        shell: bash
        run: |
          set -e
          if compgen -G "*.xcworkspace" > /dev/null; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)" >> "$GITHUB_OUTPUT"
          elif compgen -G "*.xcodeproj" > /dev/null; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)" >> "$GITHUB_OUTPUT"
          else
            echo "No Xcode project/workspace found" >&2
            exit 1
          fi

      - name: List schemes
        run: |
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.project.outputs.path }}" -list
          else
            xcodebuild -project "${{ steps.project.outputs.path }}" -list
          fi

      - name: Build simulator
        shell: bash
        run: |
          set -e
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.project.outputs.path }}" -scheme reKairos -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project "${{ steps.project.outputs.path }}" -scheme reKairos -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Archive device build
        shell: bash
        run: |
          set -e
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.project.outputs.path }}" -scheme reKairos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/reKairos.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          else
            xcodebuild -project "${{ steps.project.outputs.path }}" -scheme reKairos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/reKairos.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e
          APP_PATH="build/reKairos.xcarchive/Products/Applications/reKairos.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/reKairos.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d -print -quit)
          fi
          test -n "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/reKairos.app
          cd artifacts
          /usr/bin/zip -qry reKairos-unsigned.ipa Payload

      - name: Package simulator app
        shell: bash
        run: |
          set -e
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/*.app' -type d -print -quit)
          test -n "$APP_PATH"
          mkdir -p artifacts/simulator
          cp -R "$APP_PATH" artifacts/simulator/reKairos.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reKairos-builds
          path: |
            artifacts/reKairos-unsigned.ipa
            artifacts/simulator/reKairos.app
